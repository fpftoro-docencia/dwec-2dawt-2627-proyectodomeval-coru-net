name: Integración continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Calidad:
    name: Comprobación de calidad y estilo
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js 24 con caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Analizar código con ESLint
        run: npm run lint

      - name: Verificar formato con Prettier
        run: npm run format:check

  Tests:
    name: Pruebas unitarias, integración y cobertura
    needs: Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js 24 con caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Ejecutar tests y medir cobertura mínima (>= 90%)
        run: npm run coverage

      - name: Subir informe de cobertura como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  E2E:
    name: Pruebas extremo a extremo con Playwright
    needs: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js 24 con caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Instalar navegador Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar recorridos E2E
        run: npm run e2e

      - name: Subir informe de Playwright si falla algún recorrido
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
